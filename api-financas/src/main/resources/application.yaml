spring:
  application:
    name: api-financeira
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  data:
    redis:
      repositories:
        enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:900000}

app:
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
    refresh-session-ms: ${REFRESH_SESSION_MS:86400000}
    refresh-remember-ms: ${REFRESH_REMEMBER_MS:2592000000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    login-max-attempts: 10
    login-window-ms: 300000
    auth-max-attempts: 30
    auth-window-ms: 300000
  swagger:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

logging:
  pattern:
    level: "%5p [corrId=%X{correlationId:-none}]"