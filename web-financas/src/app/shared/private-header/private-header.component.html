<header class="site-header" [class.sidebar--expanded]="sidebar.expanded()">
  <a class="brand" routerLink="/inicio" aria-label="À Tona, início">
    <img src="brand-mark.svg" alt="" width="42" height="42" />
    <span>à tona<span class="brand-accent">.</span></span>
  </a>

  @if (context()) {
    <p class="header-context">{{ context() }}</p>
  }

  <button class="menu-toggle" type="button" (click)="sidebar.toggle()" [attr.aria-expanded]="sidebar.expanded()"
    [attr.aria-label]="sidebar.expanded() ? 'Recolher navegação' : 'Expandir navegação'"
    [attr.title]="sidebar.expanded() ? 'Recolher navegação' : 'Expandir navegação'">
    @if (sidebar.expanded()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
    }
  </button>

  <nav class="private-nav" aria-label="Área pessoal">
    <p class="nav-label">VISÃO FINANCEIRA</p>
    <a routerLink="/inicio" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 12 5l8 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5zM9 21v-6h6v6"/></svg>
      Resumo
    </a>
    <a routerLink="/movimentacoes" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14M5 10h14M5 16h9M5 21h14"/><path d="m16 15 3 3 3-3"/></svg>
      Movimentações
    </a>
    <a routerLink="/planejamento" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>
      Planejamento
    </a>
    <a routerLink="/dividas" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Dívidas
    </a>
    <a routerLink="/cartoes" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      Cartões
    </a>
  </nav>

  <div class="quick-actions">
    <p class="nav-label">ATALHOS RÁPIDOS</p>
    <a class="quick-action" routerLink="/movimentacoes" [queryParams]="{ novo: '1' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nova movimentação</span>
    </a>
  </div>

  <div class="account-area">
    <span class="account-mark" aria-hidden="true">A</span>
    <div><strong>Sua conta</strong><span>Sessão protegida</span></div>
    <button class="logout" type="button" (click)="logoutRequested.emit()" aria-label="Sair da conta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M9 12h9"/></svg><span>Sair</span>
    </button>
  </div>

  <button class="mobile-avatar" type="button" (click)="toggleAccountMenu()"
    [attr.aria-expanded]="accountMenuOpen()" aria-controls="mobile-account-menu"
    aria-label="Abrir ações da conta">
    <span aria-hidden="true">A</span>
  </button>

  @if (accountMenuOpen()) {
    <div class="mobile-account" id="mobile-account-menu">
      <nav class="mobile-account__nav" aria-label="Mais destinos">
        <a class="mobile-account__link" routerLink="/cartoes" routerLinkActive="active" ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
          (click)="closeAccountMenu()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
          <span>Cartões de crédito</span>
        </a>
      </nav>
      <p><strong>Sua conta</strong><span>Sessão protegida</span></p>
      <button class="logout" type="button" (click)="requestLogout()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M9 12h9"/></svg>
        Sair da conta
      </button>
    </div>
  }

  <nav class="bottom-nav" aria-label="Navegação rápida">
    <a routerLink="/inicio" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 12 5l8 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5zM9 21v-6h6v6"/></svg>
      <span>Início</span>
    </a>
    <a routerLink="/movimentacoes" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14M5 10h14M5 16h9M5 21h14"/><path d="m16 15 3 3 3-3"/></svg>
      <span>Movimentações</span>
    </a>
    <a class="bottom-nav__add" routerLink="/movimentacoes" [queryParams]="{ novo: '1' }" aria-label="Nova movimentação">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a routerLink="/planejamento" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>
      <span>Planejamento</span>
    </a>
    <a routerLink="/dividas" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Dívidas</span>
    </a>
    <button class="bottom-nav__more" type="button" (click)="toggleAccountMenu()"
      [class.active]="accountMenuOpen()" [attr.aria-expanded]="accountMenuOpen()"
      aria-controls="mobile-account-menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
      <span>Mais</span>
    </button>
  </nav>
</header>
