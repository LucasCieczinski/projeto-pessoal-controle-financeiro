<header class="site-header" [class.sidebar--expanded]="sidebar.expanded()">
  <a class="brand" routerLink="/inicio" aria-label="À Tona, início">
    <img src="brand-mark.svg" alt="" width="42" height="42" />
    <span>à tona<span class="brand-accent">.</span></span>
  </a>
  <button class="menu-toggle" type="button" (click)="sidebar.toggle()" [attr.aria-expanded]="sidebar.expanded()"
    [attr.aria-label]="sidebar.expanded() ? 'Recolher navegação' : 'Expandir navegação'">
    @if (sidebar.expanded()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    }
  </button>

  <nav class="private-nav" aria-label="Área pessoal">
    <p>VISÃO FINANCEIRA</p>
    <a routerLink="/inicio" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 12 5l8 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5zM9 21v-6h6v6"/></svg>
      Resumo
    </a>
    <a routerLink="/movimentacoes" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14M5 10h14M5 16h9M5 21h14"/><path d="m16 15 3 3 3-3"/></svg>
      Movimentações
    </a>
  </nav>

  <div class="account-area">
    <span class="account-mark" aria-hidden="true">A</span>
    <div><strong>Sua conta</strong><span>Sessão protegida</span></div>
    <button class="logout" type="button" (click)="logoutRequested.emit()" aria-label="Sair da conta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M9 12h9"/></svg><span>Sair</span>
    </button>
  </div>
</header>
